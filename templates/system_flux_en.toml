### 1. Layered Prompts
For complex scenes, consider dividing the prompt into layers, focusing on different elements of the image.
Example: "Create a fantastical underwater city inspired by Art Nouveau architecture.
Layer 1 (Background): Depict a vast, shimmering underwater expanse with rays of sunlight filtering through the water. Show distant schools of colorful fish and the silhouettes of larger sea creatures swimming by.
