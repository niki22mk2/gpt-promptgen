### 5. Weighting:
You can manipulate the importance of words in the prompt to intentionally emphasize or downplay specific elements. Use parentheses () to increase the importance of a word and brackets [] to decrease it. Use with clear intention and not for every word.
Examples: 
- `a (word)` - Increases the importance of 'word' by 1.1 times
- `a ((word))` - Increases the importance of 'word' by 1.21 times (1.1 * 1.1)
- `a [word]` - Decreases the importance of 'word' by 1.1 times
- `a (word:1.5)` - Increases the importance of 'word' by 1.5 times
- `a (word:0.25)` - Decreases the importance of 'word' by 4 times (1 / 0.25)

Important note: Weighting works on words.
Example:
- To emphasize a flushed face, use `(flushed:1.2) face` instead of `(flushed face:1.2)`.

### 6. Tips for Optimal Results

1. Focus on Details: FLUX.1 has a high ability to process fine details, so include as much specific information as possible in the prompt.
2. Use Natural Language: FLUX.1 understands natural language, so write the prompt in clear, descriptive sentences rather than a list of keywords.
3. Set Visual Hierarchy: Clearly distinguish between background, middle ground, and foreground elements, giving each appropriate detail.
4. Incorporate Emotional Elements: Clearly state the emotions or atmosphere the image should convey and specify the visual elements (color, light, composition, etc.) that support it.
5. Balance Style and Technical Details: Specify both artistic style and technical details (camera angle, lighting conditions, etc.) for more precise results.
6. Iteration and Refinement: If the initial result is unsatisfactory, fine-tune the prompt and retry. It is important to learn from each attempt and improve the prompt.
7. Utilize Contrast and Harmony: Aim for prompts that create contrast between different elements while maintaining overall harmony.
8. Incorporate Narrative Elements: Where possible, include narrative elements in the prompt to make it easier to generate more interesting images.

### 7. Common Pitfalls to Avoid

1. Overly Vague Prompts: Avoid vague expressions like "beautiful landscape" and provide specific details.
2. Contradictory Instructions: Be careful not to specify elements that contradict each other within the prompt.
3. Ignoring Composition: It is important to give instructions not only for individual elements but also for the overall composition of the image.
4. Overlooking Lighting and Atmosphere: These elements greatly affect the overall impression of the image, so be sure to specify them.
5. Ignoring Technical Limitations: While FLUX.1 has advanced capabilities, avoid instructions that are physically impossible or may infringe on copyright.
6. Ambiguity in Style: If you desire a specific style, specify it clearly. Without specification, FLUX.1 may apply a default realistic style.
7. Excessive Information: While details are important, excessive information that competes with each other may impair the result. Focus on important elements.
8. Lack of Emotional Context: Include not only technical details but also the emotions or atmosphere the image should evoke.

