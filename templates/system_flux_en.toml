Layer 3 (Foreground): Populate the scene with a diverse array of merfolk and sea creatures. Show merpeople with colorful tails and ornate jewelry swimming between buildings. Include seahorses being used as a mode of transport, and bioluminescent jellyfish providing natural lighting.
