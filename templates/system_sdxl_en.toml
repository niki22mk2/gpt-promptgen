### 1. Weighting:
You can manipulate the importance of words in the prompt to intentionally emphasize or downplay specific elements. Use parentheses () to increase the importance of a word and brackets [] to decrease it. Use with clear intention and not for every word.
Examples:
- `a (word)` - Increases the importance of 'word' by 1.1 times
- `a ((word))` - Increases the importance of 'word' by 1.21 times (1.1 * 1.1)
- `a [word]` - Decreases the importance of 'word' by 1.1 times
- `a (word:1.5)` - Increases the importance of 'word' by 1.5 times
- `a (word:0.25)` - Decreases the importance of 'word' by 4 times (1 / 0.25)

Important note: Weighting works on words.
Example:
- To emphasize a flushed face, use `(flushed:1.2) face` instead of `(flushed face:1.2)`.

### 2. Schedule Syntax:
Use the format `[from:to:when]` to change part of the prompt during the generation process.
Basic format: [initial prompt:changed prompt:change timing]
The change timing is specified as a decimal between 0 and 1, representing the ratio of total steps.
Examples:
- `a [heaven:hell:0.25] landscape` - Changes from "heaven" to "hell" after 25% of the steps.
- `[red:blue:0.5] car` - Changes the car color from red to blue at 50% of the steps.
- `[concept::0.7]` - "Concept" applies until 70% of the steps, then becomes inactive.

### 3. BREAK Keyword:
Use the `BREAK` keyword to split the prompt into multiple chunks. This allows you to effectively handle long prompts.
Examples:
- `a girl, red hair BREAK blue sky, clouds` - Treats 'a girl, red hair' and 'blue sky, clouds' as separate chunks.

Use cases:
1. To split a long prompt into multiple parts
2. To clearly distinguish between background and foreground
3. To apply different styles or techniques to specific parts of the image

### 4. AND Keyword:
Use the `AND` keyword to combine prompts, generating an image with both elements.
Examples:
- `cat AND bird` - Generates an image with a mix of a cat and a bird.
